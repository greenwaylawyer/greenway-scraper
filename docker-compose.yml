
services:
  scraper:
    build: .
    container_name: greenway_scraper
    env_file:
      - .env
    volumes:
      - .:/app
      - ./output:/app/output
      - ./checkpoints:/app/checkpoints
    depends_on:
      - flaresolverr
    networks:
      - greenway_network
    # Keep container running without auto-executing scraper
    # Run scraper on-demand: docker exec greenway_scraper python run.py --state california --export-scraper --layer state_bars
    entrypoint: ["tail", "-f", "/dev/null"]

  # FlareSolverr: handles Cloudflare-protected sites (e.g. Justia, Avvo).
  # It launches a real Chrome browser internally and solves CF challenges,
  # then returns plain HTML to the scraper via a simple HTTP API.
  # API endpoint: http://flaresolverr:8191/v1
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: greenway_flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    ports:
      - "8191:8191"    # accessible from host at http://localhost:8191
    networks:
      - greenway_network

networks:
  greenway_network:
    name: greenway_lawyer_portal_greenway
    external: true
