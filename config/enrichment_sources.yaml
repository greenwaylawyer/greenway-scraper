# ============================================================================
# Enrichment Source Configuration
# ============================================================================
# Defines all enrichment sources for Layers 3 and 4.
# Each source_key here must match the key used in:
#   - enrichment_source_requests.source_key
#   - lawyer_enrichment.raw_data_by_source keys
# ============================================================================

mvp_google_first:
  enabled: true
  target_total_profiles: 10000
  city_tiers:
    tier1:
      min_population: 1000000
      query_count_min: 40
      query_count_max: 50
    tier2:
      min_population: 250000
      query_count_min: 20
      query_count_max: 30
    tier3:
      min_population: 100000
      query_count_min: 10
      query_count_max: 15
    tier4:
      min_population: 50000
      query_count_min: 5
      query_count_max: 8
  # Practice areas to search. Add more (e.g. Criminal Defense, Family Law) to
  # broaden discovery beyond immigration.
  practice_areas:
    - Immigration
  states:
    CA: 1500
    NY: 1300
    TX: 1000
    FL: 900
    IL: 600
    PA: 500
    OH: 450
    GA: 400
    NJ: 350
    NC: 350
    VA: 250
    AZ: 250
    MA: 250
    MI: 300
    WA: 250
    IN: 200
    MO: 200
    MD: 200
    WI: 150
    CO: 200
    TN: 200
    MN: 200
  google_api:
    endpoint: "https://maps.googleapis.com/maps/api/place/textsearch/json"
    page_size: 20
    max_pages_per_query: 3
    query_templates:
      - "{practice_area} lawyer in {city}, {state_code}"
      - "{practice_area} attorney in {city}, {state_code}"
  thresholds:
    min_google_rating: 3.5
    min_google_review_count: 5
    min_popularity_score_normalized: 40
  defaults:
    per_state_batch_limit: 1000
    dry_run_limit_profiles: 200

sources:

  # ==========================================================================
  # Layer 3: Multi-Source Enrichment
  # ==========================================================================

  justia:
    name: Justia
    layer: 3
    icon: justia
    enabled: true
    scraper_module: scrapers.enrichers.justia
    scraper_class: JustiaEnricher
    rate_limit: 10  # requests per minute
    state_specific: false  # national scraper — works for all states
    discovery:
      strategies:
        - name_city_search
        - bar_number_search
      auto_merge_on:
        - bar_number  # auto-select if bar number matches
      search_url_template: "https://lawyers.justia.com/search?query={name}&location={city}+{state}"
      confidence_threshold: 0.90  # auto-select if confidence >= this
    fields_provided:
      - bio
      - practice_areas
      - education_history
      - photo_url
      - websites
      - languages
      - social_links

  avvo:
    name: Avvo
    layer: 3
    icon: avvo
    enabled: true  # routed through Apify (see api_module) — browser scraping is blocked in prod
    api_module: scrapers.enrichers.apify_avvo
    api_class: ApifyAvvoEnricher
    rate_limit: 5  # Apify runs per minute (bulk worker batches many profiles per run)
    state_specific: false
    apify:
      # fatihtahta/avvo-scraper — Avvo Scraper with Mails | US Lawyer Directory.
      actor_id: "LfLFZ56UVZYR73Fer"
      timeout_seconds: 1800
      input:
        proxyConfiguration:
          useApifyProxy: true
          apifyProxyGroups: ["RESIDENTIAL"]
    discovery:
      strategies:
        - name_city_search
        - phone_search
      auto_merge_on:
        - bar_number
      search_url_template: "https://www.avvo.com/search/lawyer_search?q={name}&loc={city}+{state}"
      confidence_threshold: 0.90
    fields_provided:
      - bio
      - practice_areas
      - work_history
      - education_history
      - professional_associations
      - publications
      - awards
      - languages
      - photo_url
      - phone
      - address
      - avvo_rating
      - client_rating
      - client_review_count
      - websites
      - social_links

  lawyers_com:
    name: Lawyers.com
    layer: 3
    icon: lawyers_com
    enabled: false  # Not yet implemented
    scraper_module: scrapers.enrichers.lawyers_com
    scraper_class: LawyersComEnricher
    rate_limit: 10
    state_specific: false
    discovery:
      strategies:
        - name_city_search
      auto_merge_on:
        - bar_number
      confidence_threshold: 0.90
    fields_provided:
      - bio
      - practice_areas
      - peer_reviews
      - education_history
      - websites

  # ==========================================================================
  # Layer 4: Reviews & Ratings
  # ==========================================================================

  google_maps:
    name: Google Maps
    layer: 4
    icon: google
    enabled: true
    api_module: scrapers.enrichers.google_places
    api_class: GooglePlacesEnricher
    rate_limit: 50  # Places API rate limit
    state_specific: false  # common for all states
    min_completeness: 60  # only process profiles with score >= this
    batch_size: 500  # profiles per manual trigger or scheduled run
    refresh_interval_days: 30  # re-fetch ratings monthly
    cost_per_1000_usd: 34  # approx cost for discovery + details
    discovery:
      strategies:
        - places_api_search
      auto_merge_on:
        - address_match
        - phone_match
      verification_fields:
        - formatted_address
        - formatted_phone_number
      confidence_threshold: 0.60
    fields_provided:
      - rating
      - review_count
      - reviews  # up to 5 most recent
      - photos
      - place_id
      - google_maps_url
      - formatted_phone_number  # for verification / gap-filling
