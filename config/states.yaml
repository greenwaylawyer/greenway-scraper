# State Bar Association Scraper Configuration
# This file contains configuration for each state's bar association website

california:
  name: California State Bar
  source: calbar
  state_code: CA
  base_url: "https://members.calbar.ca.gov"
  search_url: "https://members.calbar.ca.gov/fal/Member/Detail/RSO"
  rate_limit: 20  # requests per minute
  has_search_api: false
  pagination_type: query  # query, form_post, scroll, infinite
  total_lawyers_estimate: 200000
  requires_browser: true  # Uses Playwright
  notes: |
    California Bar website uses server-rendered HTML with minimal JavaScript.
    Search results are displayed in a table format.
    Need to inspect actual website to verify selectors.

