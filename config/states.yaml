# Enrichment Sources (not state bars)

justia:
  name: Justia Lawyer Directory
  source: justia
  base_url: "https://lawyers.justia.com"
  rate_limit: 10
  has_search_api: false
  notes: |
    Justia profiles for enrichment.
    Must be respectful and check robots.txt.

courtlistener:
  name: CourtListener
