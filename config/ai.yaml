# Greenway Scraper - AI Service Configuration
#
# Toggle the 'enabled' flag at top level to pause/stop ALL AI features instantly.
# Individual features can also be toggled independently.

ai:
  # Master kill-switch. Set to false to disable all AI calls without touching
  # individual feature flags. The pipeline falls back to rule-based logic.
  enabled: false

  # Primary provider
  #   gemini     -> Google Gemini via google-genai SDK (default; cost-effective)
  #   anthropic  -> Anthropic Claude via anthropic SDK
  provider: gemini
  model: gemini-3.8-flash   # Cheap, fast — correct for batch enrichment

  # Per-feature toggles (only active when master enabled: true)
  features:
    practice_area_normalization:
      enabled: true
      model: gemini-3.8-flash   # Flash sufficient for classification
      batch_size: 50                      # Terms per API call

    data_quality_scoring:
      enabled: false    # Phase 3 — not yet implemented
      model: gemini-3.8-flash

    merge_arbitration:
      enabled: true
      model: gemini-3.8-flash  # Flash handles merge arbitration well; bump to gemini-2.5-pro if quality drops
      batch_size: 100

    approval_decisions:
      enabled: false    # Phase 6 — not yet implemented
      model: gemini-3.8-flash

  # Response cache (SQLite) — avoids re-calling AI for identical inputs
  cache:
    enabled: true
    db_path: ".ai_cache.db"   # relative to project root
    ttl_hours: 168            # 1 week — clear if prompts change (version below)
    prompt_version: "v1"      # Bump this whenever prompt templates change

  # API rate limiting
  rate_limits:
    requests_per_minute: 50
    max_retries: 3
    retry_delay_seconds: 5

  # Cost controls
  cost_controls:
    max_tokens_per_call: 1024
    warn_at_monthly_usd: 50     # Log warning when estimated spend exceeds this
    stop_at_monthly_usd: 100    # Stop AI calls when estimated spend exceeds this
